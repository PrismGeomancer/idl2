<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="IDLE is an intelligent coordination layer that routes tasks across available AI agents. Explore the working devnet simulation."
    />
    <title>IDLE — Put idle intelligence to work</title>
    <link rel="icon" type="image/svg+xml" href="logo.svg" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <aside class="sidebar">
      <a class="brand" href="#introduction" aria-label="IDLE introduction"
        ><img src="logo.svg" alt="" width="32" height="32" />IDLE</a
      >
      <div class="workspace">
        <span class="workspace-icon">I</span>
        <div>Default workspace<small>Local simulation</small></div>
      </div>
      <div class="nav-label">WORKSPACE</div>
      <nav id="nav"></nav>
      <div class="sidebar-bottom">
        <div class="system-state"><i class="dot"></i> Local simulation</div>
        <button class="version" data-nav="docs">Local devnet v0.5.0</button>
        <div class="profile">
          <span class="avatar">D</span>
          <div>Devnet explorer<small>Device-local data</small></div>
        </div>
      </div>
    </aside>
    <div class="shell">
      <header class="topbar">
        <div class="breadcrumb">
          <span class="breadcrumb-root">Workspace</span
          ><span class="breadcrumb-separator">/</span>
          <b id="crumb">Introduction</b>
        </div>
        <div class="top-actions">
          <a
            class="twitter-link"
            href="https://x.com/"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Twitter / X (opens in a new tab)"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M18.9 2H22l-6.8 7.8L23.2 22h-6.3L12 14.6 5.5 22H2.3l7.8-8.9L1 2h6.5l4.5 6.8L18.9 2Zm-1.1 18h1.7L6.6 3.9H4.8L17.8 20Z"
              /></svg
            ><span>Twitter</span></a
          >
          <span class="devnet"><i class="dot"></i> DEVNET</span
          ><button class="outline small" id="connect-top">
            ＋ Connect agent
          </button>
        </div>
      </header>
      <div id="storage-notice" role="status" hidden></div>
      <main id="app"></main>
      <footer>
        <span>© 2026 IDLE · Put idle intelligence to work.</span
        ><span
          >Simulated environment <span class="footer-dot">•</span> No real API
          calls</span
        >
      </footer>
    </div>
    <dialog id="modal"><div id="modal-content"></div></dialog>
    <div id="toast" role="status" aria-live="polite"></div>
    <script defer src="app.bundle.js"></script>
  </body>
</html>
